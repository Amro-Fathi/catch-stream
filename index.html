<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Torrentio Stream Finder</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #090b12;
        --surface: #121622;
        --surface-hover: #191f30;
        --border: #272d40;
        --text: #f1f5f9;
        --muted: #8993a8;
        --accent: #8b5cf6;
        --accent-light: #a78bfa;
        --green: #34d399;
        --red: #fb7185;
      }

      body {
        min-height: 100vh;
        padding: 50px 20px;
        background: radial-gradient(ellipse at 50% 0%, #30205255, transparent 45%), var(--bg);
        color: var(--text);
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .container {
        width: min(900px, 100%);
        margin: auto;
      }

      /* Header */

      .header {
        margin-bottom: 40px;
        text-align: center;
      }

      .logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 58px;
        height: 58px;
        margin-bottom: 20px;
        border: 1px solid #a78bfa55;
        border-radius: 18px;
        background: #8b5cf622;
        color: var(--accent-light);
        font-size: 28px;
        box-shadow: 0 0 40px #8b5cf622;
      }

      .header h1 {
        margin-bottom: 12px;
        font-size: clamp(30px, 5vw, 44px);
        font-weight: 800;
        letter-spacing: -1.5px;
      }

      .header h1 span {
        color: var(--accent-light);
      }

      .header p {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.7;
      }

      /* Search panel */

      .search-panel {
        padding: 26px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: linear-gradient(145deg, #171b2a, #10131d);
        box-shadow: 0 20px 70px #00000025;
      }

      .label-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      label {
        font-size: 14px;
        font-weight: 700;
      }

      .label-hint {
        color: var(--muted);
        font-size: 12px;
      }

      .input-row {
        display: flex;
        gap: 12px;
      }

      #imdbId {
        min-width: 0;
        flex: 1;
        padding: 16px 18px;
        border: 1px solid var(--border);
        border-radius: 12px;
        outline: none;
        background: #090c14;
        color: var(--text);
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      #imdbId::placeholder {
        color: #606a7e;
      }

      #imdbId:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px #8b5cf622;
      }

      #searchBtn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 0 24px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #8b5cf6, #6d28d9);
        color: white;
        font-weight: 700;
        transition:
          transform 0.2s,
          filter 0.2s;
      }

      #searchBtn:hover:not(:disabled) {
        transform: translateY(-2px);
        filter: brightness(1.15);
      }

      #searchBtn:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .search-note {
        margin-top: 12px;
        color: var(--muted);
        font-size: 12px;
      }

      /* Status */

      #status {
        margin-top: 24px;
      }

      .message {
        padding: 16px 18px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .message.error {
        border-color: #fb718533;
        color: var(--red);
      }

      .message.success {
        border-color: #34d39933;
        color: var(--green);
      }

      .loading {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .spinner {
        width: 19px;
        height: 19px;
        border: 2px solid #8b5cf644;
        border-top-color: var(--accent-light);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Results */

      .results-section {
        margin-top: 36px;
      }

      .results-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        margin-bottom: 18px;
      }

      .results-header h2 {
        font-size: 21px;
        letter-spacing: -0.5px;
      }

      #resultCount {
        padding: 6px 11px;
        border: 1px solid #8b5cf644;
        border-radius: 20px;
        background: #8b5cf61a;
        color: var(--accent-light);
        font-size: 12px;
        font-weight: 700;
      }

      .stream-list {
        display: grid;
        gap: 14px;
      }

      .stream-card {
        overflow: hidden;
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        transition:
          border-color 0.2s,
          background 0.2s,
          transform 0.2s;
        animation: appear 0.35s ease both;
      }

      .stream-card:hover {
        transform: translateY(-2px);
        border-color: #8b5cf677;
        background: var(--surface-hover);
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(8px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .stream-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
      }

      .stream-info {
        min-width: 0;
      }

      .stream-name {
        margin-bottom: 10px;
        overflow-wrap: anywhere;
        font-size: 15px;
        font-weight: 750;
        line-height: 1.6;
      }

      .stream-source {
        display: inline-flex;
        padding: 5px 9px;
        border: 1px solid #8b5cf633;
        border-radius: 6px;
        background: #8b5cf615;
        color: var(--accent-light);
        font-size: 11px;
        font-weight: 700;
      }

      .stream-number {
        flex-shrink: 0;
        color: #59647a;
        font-size: 13px;
        font-weight: 700;
      }

      .hash-label {
        display: block;
        margin-top: 20px;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .hash-box {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px;
        border: 1px solid #272d40;
        border-radius: 9px;
        background: #090c14;
      }

      .hash-value {
        min-width: 0;
        flex: 1;
        overflow-wrap: anywhere;
        color: #c4b5fd;
        font-family: Consolas, Monaco, monospace;
        font-size: 12px;
        line-height: 1.6;
      }

      .stream-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }

      .action-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 10px 13px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #1a2030;
        color: #dce2ef;
        font-size: 12px;
        font-weight: 700;
        transition:
          background 0.2s,
          border-color 0.2s;
      }

      .action-btn:hover {
        border-color: #8b5cf677;
        background: #252b40;
      }

      .action-btn.primary {
        border-color: #8b5cf644;
        background: #8b5cf61c;
        color: var(--accent-light);
      }

      .action-btn.primary:hover {
        background: #8b5cf633;
      }

      .empty-state {
        padding: 42px 20px;
        border: 1px dashed var(--border);
        border-radius: 16px;
        text-align: center;
      }

      .empty-icon {
        margin-bottom: 15px;
        color: #6d758b;
        font-size: 34px;
      }

      .empty-state h3 {
        margin-bottom: 8px;
        font-size: 16px;
      }

      .empty-state p {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }

      .footer {
        margin-top: 45px;
        color: #626d83;
        font-size: 12px;
        line-height: 1.7;
        text-align: center;
      }

      @media (max-width: 560px) {
        body {
          padding: 35px 14px;
        }

        .search-panel {
          padding: 19px;
        }

        .input-row {
          flex-direction: column;
        }

        #searchBtn {
          min-height: 48px;
        }

        .label-hint {
          display: none;
        }

        .stream-card {
          padding: 16px;
        }

        .action-btn {
          flex: 1;
        }
      }
    </style>
  </head>

  <body>
    <main class="container">
      <header class="header">
        <div class="logo">▶</div>

        <h1>Torrentio <span>Finder</span></h1>

        <p>
          Search for available movie streams using an IMDb ID.
          <br />
          Simple, fast, and all in one place.
        </p>
      </header>

      <section class="search-panel">
        <form id="searchForm">
          <div class="label-row">
            <label for="imdbId">IMDb Movie ID</label>
            <span class="label-hint">Example: tt22084616</span>
          </div>

          <div class="input-row">
            <input id="imdbId" type="text" placeholder="Enter IMDb ID..." autocomplete="off" spellcheck="false" required />

            <button id="searchBtn" type="submit">
              <span>⌕</span>
              <span id="buttonText">Find Streams</span>
            </button>
          </div>

          <p class="search-note">Enter the IMDb ID of the movie you want to search for.</p>
        </form>
      </section>

      <div id="status" aria-live="polite"></div>

      <section class="results-section" id="resultsSection" hidden>
        <div class="results-header">
          <h2>Available Streams</h2>
          <span id="resultCount">0 streams</span>
        </div>

        <div class="stream-list" id="streamList"></div>
      </section>

      <footer class="footer">Torrentio Stream Finder · Powered by the Torrentio API</footer>
    </main>

    <script>
      const form = document.querySelector("#searchForm");
      const imdbInput = document.querySelector("#imdbId");
      const searchBtn = document.querySelector("#searchBtn");
      const buttonText = document.querySelector("#buttonText");
      const status = document.querySelector("#status");
      const resultsSection = document.querySelector("#resultsSection");
      const resultCount = document.querySelector("#resultCount");
      const streamList = document.querySelector("#streamList");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const imdbId = imdbInput.value.trim();

        // Validate the IMDb ID.
        if (!/^tt\d+$/.test(imdbId)) {
          showMessage("Please enter a valid IMDb ID, such as tt22084616.", "error");
          imdbInput.focus();
          return;
        }

        // Reset the previous results.
        status.innerHTML = "";
        streamList.innerHTML = "";
        resultsSection.hidden = true;

        // Show loading state.
        searchBtn.disabled = true;
        buttonText.textContent = "Searching...";

        showMessage('<div class="loading"><span class="spinner"></span><span>Searching for available streams...</span></div>', "", true);

        try {
          const response = await fetch(`https://torrentio.strem.fun/stream/movie/${encodeURIComponent(imdbId)}.json`);

          if (!response.ok) {
            throw new Error(`The request failed with HTTP status ${response.status}.`);
          }

          const data = await response.json();

          if (!Array.isArray(data.streams)) {
            throw new Error("The API returned an unexpected response. Please try again.");
          }

          const streams = data.streams;

          status.innerHTML = "";

          if (streams.length === 0) {
            showMessage("No streams were found for this IMDb ID. Try another movie or check the ID.", "error");
            return;
          }

          renderStreams(streams);

          showMessage(`Successfully retrieved ${streams.length} stream${streams.length === 1 ? "" : "s"}.`, "success");

          console.table(
            streams.map((stream) => ({
              name: stream.name,
              title: stream.title,
              url: stream.url ?? null,
              infoHash: stream.infoHash ?? null,
              fileIdx: stream.fileIdx ?? null,
            })),
          );
        } catch (error) {
          console.error(error);

          showMessage(
            error instanceof TypeError
              ? "Could not connect to Torrentio. Check your internet connection, or see whether the API is accessible."
              : error.message || "Something went wrong. Please try again.",
            "error",
          );
        } finally {
          searchBtn.disabled = false;
          buttonText.textContent = "Find Streams";
        }
      });

      function showMessage(message, type = "", isHtml = false) {
        const element = document.createElement("div");
        element.className = `message ${type}`;

        if (isHtml) {
          element.innerHTML = message;
        } else {
          element.textContent = message;
        }

        status.replaceChildren(element);
      }

      function renderStreams(streams) {
        resultsSection.hidden = false;
        resultCount.textContent = `${streams.length} stream${streams.length === 1 ? "" : "s"}`;

        const fragment = document.createDocumentFragment();

        streams.forEach((stream, index) => {
          const card = document.createElement("article");
          card.className = "stream-card";
          card.style.animationDelay = `${Math.min(index * 35, 350)}ms`;

          const title = stream.title || "Untitled stream";
          const source = stream.name || "Unknown source";
          const infoHash = stream.infoHash || "";
          const magnet = infoHash ? `magnet:?xt=urn:btih:${infoHash}` : "";

          // Build the card safely without inserting API text as HTML.
          const top = document.createElement("div");
          top.className = "stream-top";

          const info = document.createElement("div");
          info.className = "stream-info";

          const titleElement = document.createElement("h3");
          titleElement.className = "stream-name";
          titleElement.textContent = title;

          const sourceElement = document.createElement("span");
          sourceElement.className = "stream-source";
          sourceElement.textContent = source;

          info.append(titleElement, sourceElement);

          const number = document.createElement("span");
          number.className = "stream-number";
          number.textContent = `#${String(index + 1).padStart(2, "0")}`;

          top.append(info, number);
          card.append(top);

          if (magnet) {
            const hashLabel = document.createElement("span");
            hashLabel.className = "hash-label";
            hashLabel.textContent = "Magnet link";

            const hashBox = document.createElement("div");
            hashBox.className = "hash-box";

            const hashValue = document.createElement("span");
            hashValue.className = "hash-value";
            hashValue.textContent = magnet;

            hashBox.append(hashValue);
            card.append(hashLabel, hashBox);

            const actions = document.createElement("div");
            actions.className = "stream-actions";

            const copyButton = document.createElement("button");
            copyButton.className = "action-btn primary";
            copyButton.type = "button";
            copyButton.textContent = "⧉ Copy Magnet";

            copyButton.addEventListener("click", async () => {
              try {
                await navigator.clipboard.writeText(magnet);
                copyButton.textContent = "✓ Copied!";

                setTimeout(() => {
                  copyButton.textContent = "⧉ Copy Magnet";
                }, 1600);
              } catch {
                // Clipboard access may require HTTPS or localhost.
                const textArea = document.createElement("textarea");
                textArea.value = magnet;
                textArea.style.position = "fixed";
                textArea.style.opacity = "0";
                document.body.append(textArea);
                textArea.select();

                const copied = document.execCommand("copy");
                textArea.remove();

                copyButton.textContent = copied ? "✓ Copied!" : "Copy unavailable";
              }
            });

            const openButton = document.createElement("button");
            openButton.className = "action-btn";
            openButton.style.display = "none";
            openButton.type = "button";
            openButton.textContent = "↗ Open Magnet";

            openButton.addEventListener("click", () => {
              window.location.href = magnet;
            });

            actions.append(copyButton, openButton);
            card.append(actions);
          } else {
            const missing = document.createElement("p");
            missing.className = "search-note";
            missing.textContent = "This stream does not provide an infoHash.";
            card.append(missing);
          }

          fragment.append(card);
        });

        streamList.replaceChildren(fragment);
      }

      // Allow entering an IMDb ID directly in the URL:
      // ?imdb=tt22084616
      const params = new URLSearchParams(window.location.search);
      const initialId = params.get("imdb");

      if (initialId) {
        imdbInput.value = initialId;
        form.requestSubmit();
      }
    </script>
  </body>
</html>
